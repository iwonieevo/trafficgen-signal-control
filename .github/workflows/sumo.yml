name: SUMO
on:
  workflow_dispatch:
  pull_request:
    paths: &sumo-paths
      - ".github/workflows/sumo.yml"
      - "pyproject.toml"
      - "scripts/run_sumo.py"
      - "sumo/**"
      - "tests/sumo/**"
      - "uv.lock"
  push:
    branches: [main]
    paths: *sumo-paths

jobs:
  run-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group dev --group sumo
      - run: uv run --no-sync pytest tests/sumo

[project]
name = "trafficgen-signal-control"
version = "0.1.0"
description = "Traffic generation and reinforcement learning based traffic signal control in SUMO"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
sumo = [
    "eclipse-sumo==1.28.0",
]
notebook = [
    "jupyterlab>=4.6.5",
    "matplotlib>=3.11.2",
    "statsmodels>=0.15.0",
]

[tool.uv]
default-groups = ["dev", "sumo", "notebook"]

[tool.uv.build-backend]
module-name = "trafficgen"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "scripts", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests/main", "tests/sumo"]

name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      # Only the dev group: SUMO and other heavy dependencies are not needed here.
      - run: uv sync --locked --no-default-groups --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest -m "not sumo"

  test-platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python: "3.14"}
          - {os: macos-latest, python: "3.14"}
          # The oldest version allowed by requires-python.
          - {os: ubuntu-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group dev
      - run: uv run --no-sync pytest -m "not sumo"

name: All platforms
# Ubuntu is the main CI platform. Start this workflow by hand to check the other ones.
on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group dev --group sumo
      - run: uv run --no-sync pytest tests/main tests/sumo
